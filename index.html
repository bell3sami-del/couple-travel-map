<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 둘의 바다 여정</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e5f6fc;color:#153b54;font-family:system-ui,'Apple SD Gothic Neo',sans-serif}.wrap{max-width:780px;margin:auto;padding:22px 13px 50px;background:linear-gradient(#e9f8ff,#b3e9f7 55%,#e9fbfc);min-height:100vh}.heading{text-align:center;padding:28px 10px 12px}.eyebrow{letter-spacing:4px;font-size:12px;color:#4389a9;font-weight:800}.heading h1{font-size:clamp(27px,6vw,40px);line-height:1.25;margin:14px 0}.heading p{color:#46758d;font-size:14px}.characters{display:flex;justify-content:center;gap:20px;margin:14px 0}.character{background:#ffffffb9;border:2px solid white;border-radius:20px;padding:12px 9px;width:145px;box-shadow:0 4px 18px #73bad020;text-align:center}.character .face{font-size:45px}.character strong{display:block;font-size:13px}.character small{font-size:10px;color:#52798b}.toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:22px 0}.toolbar button,.toolbar select{border:1px solid #8bc8dc;border-radius:20px;background:white;padding:9px 15px;color:#1b5d79;font-weight:700;cursor:pointer}.toolbar button.primary{background:#ff955b;color:white;border-color:#ff955b}.stats{text-align:center;font-size:12px;color:#397a95;margin-bottom:8px}.timeline{position:relative;width:100%;overflow:hidden}.timeline svg{width:100%;height:auto;display:block;overflow:visible}.node-label{font-size:12px;font-weight:750;fill:#17465d;text-anchor:middle}.node-date{font-size:11px;fill:#4b8ba4;text-anchor:middle}.node-icon{font-size:26px;text-anchor:middle;dominant-baseline:middle}.node-circle{fill:#fff;stroke:#8fc8d8;stroke-width:3;filter:drop-shadow(0 3px 3px #317b9540)}.node-circle.visited{stroke:#ff995e}.node-circle.future{stroke-dasharray:3 5;opacity:.65}.route{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}.route-inner{fill:none;stroke:#68b5d0;stroke-width:3;stroke-linecap:round;stroke-dasharray:4 8}.empty{text-align:center;padding:30px;color:#4d8296}.settings{background:#ffffffd9;border-radius:18px;padding:16px;margin:22px 6px}.settings h3{margin:0 0 7px}.settings p{font-size:12px;color:#5d8291}.trip-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:300px;overflow:auto}.trip-list label{display:flex;gap:5px;align-items:center;font-size:12px;padding:7px;background:#eaf7fa;border-radius:8px}.trip-list input{accent-color:#f98750}.footer{text-align:center;font-size:13px;color:#397a95;padding:25px}.badge{display:inline-block;background:#fff4dd;border-radius:15px;padding:5px 12px;color:#ba794b;font-size:12px}@media(max-width:430px){.wrap{padding:10px 5px}.node-label{font-size:12px}.trip-list{grid-template-columns:1fr}.character{width:135px}}.avatar{width:100%;height:125px;object-fit:cover;border-radius:12px;background:#bdeaf4}.avatar-man{object-position:left center;clip-path:inset(0 50% 0 0);width:200%;max-width:none}.avatar-woman{object-position:right center;clip-path:inset(0 0 0 50%);width:200%;max-width:none;transform:translateX(-50%)}.character{overflow:hidden}.timeline{min-height:120px}.moving-divers{filter:drop-shadow(0 5px 5px #165f8070);pointer-events:none}.route-inner{stroke:#ff985d;stroke-width:4;stroke-dasharray:none}.route{stroke:#fff;stroke-width:12}@media(prefers-reduced-motion:reduce){.moving-divers{transition:none}} .character-crop{height:140px;width:100%;background-image:url('assets/couple-divers.png');background-repeat:no-repeat;background-size:275px auto;border-radius:12px;background-color:#d4f1f8}.man-crop{background-position:0px 0px}.woman-crop{background-position:-142px 0px}.moving-divers{display:none}.traveler-photo{pointer-events:none;filter:drop-shadow(0 5px 6px #195f8266)} </style></head>
<body><div class="wrap"><header class="heading"><div class="eyebrow">OUR OCEAN JOURNEY</div><span class="badge">함께한 바다의 기록</span><h1>우리 둘의<br>바다 여행 연대기 💙</h1><p>하나의 길 위에 쌓여가는 소중한 여행들</p><div class="characters"><div class="character" style="width:min(100%,420px)"><img src="assets/couple-fullbody.png?v=transparent2" alt="검정 잠수복과 카메라를 든 남편, 흰색 마스크와 고프로를 든 아내의 전신 일러스트" style="width:100%;height:auto;border-radius:14px;display:block"><strong>우리 둘의 바다 여행</strong></div></div></header>
<div class="toolbar"><button class="primary" id="play">▶ 여행 재생</button><button id="all">전체 보기</button><select id="year"><option value="all">전체 연도</option></select></div><div class="stats" id="status"></div><div class="timeline" id="timeline"></div>
<section class="settings"><h3>💕 부부가 함께한 여행 선택</h3><p>기존 여행 기록 중 함께한 곳만 선택해 주세요. 선택 정보는 현재 브라우저에만 저장돼요.</p><div class="trip-list" id="trips"></div></section><div class="footer">앞으로도 함께할 바다를 기다리며 🐬</div></div>
<script>const raw=[
[2018,'06','보홀'],[2018,'09','제주'],[2018,'09','사이판'],[2018,'12','보홀'],
[2019,'03','모알보알'],[2019,'06','사이판'],[2019,'07','아날라오'],[2019,'09','고성'],[2019,'10','아날라오'],[2019,'12','팔라우'],
[2020,'04','제주'],[2020,'06','제주'],[2020,'06','울진'],[2020,'07','울진'],[2020,'09','제주'],[2020,'10','제주'],[2020,'10','강릉'],[2020,'11','영덕'],
[2021,'08','제주'],[2021,'08','양양'],[2021,'08','고성'],[2021,'09','제주'],[2021,'10','제주'],[2021,'10','제주'],[2021,'10','대전'],[2021,'10','울릉도'],[2021,'11','제주'],
[2022,'05','릴로안'],[2022,'09','라파즈'],[2022,'10','울릉도'],[2022,'11','베르데'],
[2023,'01','보홀'],[2023,'03','오키나와'],[2023,'05','시파단'],[2023,'06','릴로안'],[2023,'06','사이판'],[2023,'07','홍해'],[2023,'08','코모도'],
[2024,'04','아날라오'],[2024,'06','라파즈'],[2024,'09','반다해'],[2024,'09','시파단'],
[2025,'04','라파즈'],[2025,'04','제주'],[2025,'05','팔라우'],[2025,'08','양양'],[2025,'09','제주'],[2025,'10','키커락'],[2025,'10','갈라파고스'],
[2026,'03','푸껫'],[2026,'03','시밀란'],[2026,'06','오키나와'],[2026,'10','제주'],[2026,'11','이시가키']
];
const trips=raw.map((r,i)=>({id:i,year:r[0],month:r[1],place:r[2]}));
const icons=['⛵','🌴','🐢','🪸','🐠','🦈','🐬'];
const selected=new Set(JSON.parse(localStorage.getItem('coupleTrips')||'[]'));
const year=document.getElementById('year'),status=document.getElementById('status'),timeline=document.getElementById('timeline'),list=document.getElementById('trips');
[...new Set(trips.map(t=>t.year))].forEach(y=>{let o=document.createElement('option');o.value=y;o.textContent=y+'년';year.append(o)});
let timer=null,shown=Infinity,raf=null,progress=0,animStart=0,animDuration=0;
function data(){return trips.filter(t=>selected.has(t.id)&&(year.value==='all'||t.year===Number(year.value)))}
function stop(){if(timer)clearInterval(timer);timer=null;if(raf)cancelAnimationFrame(raf);raf=null;document.getElementById('play').textContent='▶ 여행 재생'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){const arr=data(),visible=arr;status.textContent='선택한 여행 '+arr.length+'곳 · 표시 중 '+Math.min(shown,arr.length)+'곳';if(!arr.length){timeline.innerHTML='<p class="empty">아래에서 함께한 여행을 선택하면<br>구불구불한 여행길이 만들어져요 🐠</p>';return}
const W=660,cols=3,xs=[108,330,552],top=145,rowH=145,rows=Math.ceil(visible.length/cols),H=Math.max(155,rows*rowH+85);
const coords=visible.map((t,i)=>{let r=Math.floor(i/cols),c=i%cols;return {x:xs[r%2===0?c:2-c],y:top+r*rowH,t,i}});
let path='';coords.forEach((p,i)=>{if(i===0){path='M '+p.x+' '+p.y;return}const prev=coords[i-1];if(prev.y===p.y){path+=' L '+p.x+' '+p.y}else{const side=prev.x===xs[2]?xs[2]+38:xs[0]-38;path+=' Q '+side+' '+(prev.y+rowH/2)+' '+p.x+' '+p.y}});
let nodes=coords.map(p=>'<g><circle class="node-circle visited" cx="'+p.x+'" cy="'+p.y+'" r="29"/><text class="node-icon" x="'+p.x+'" y="'+(p.y+1)+'">'+icons[p.i%icons.length]+'</text><text class="node-date" x="'+p.x+'" y="'+(p.y+46)+'">'+p.t.year+'.'+p.t.month+'</text><text class="node-label" x="'+p.x+'" y="'+(p.y+63)+'">'+esc(p.t.place)+'</text></g>').join('');
timeline.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="지그재그로 이어진 여행 연대기"><path class="route" d="'+path+'"/><path id="travelPath" class="route-inner" d="'+path+'"/>'+nodes+'<image id="travelers" class="traveler-photo" href="assets/couple-fullbody.png?v=transparent2" x="-52" y="-45" width="104" height="84"/></svg>';placeTraveler(progress)}
function placeTraveler(t){const path=document.getElementById('travelPath'),trav=document.getElementById('travelers');if(!path||!trav)return;const len=path.getTotalLength();const pt=path.getPointAtLength(len*Math.max(0,Math.min(1,t)));trav.setAttribute('x',pt.x-52);trav.setAttribute('y',pt.y-100)}
function animate(ts){if(!animStart)animStart=ts;progress=Math.min(1,(ts-animStart)/animDuration);placeTraveler(progress);const arr=data();const passed=Math.floor(progress*Math.max(0,arr.length-1))+1;status.textContent='선택한 여행 '+arr.length+'곳 · 이동 중 '+passed+'/'+arr.length+'곳';if(progress<1){raf=requestAnimationFrame(animate)}else{raf=null;document.getElementById('play').textContent='▶ 다시 재생'}}
function renderList(){list.innerHTML='';trips.filter(t=>year.value==='all'||t.year===Number(year.value)).forEach(t=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=selected.has(t.id);input.onchange=()=>{input.checked?selected.add(t.id):selected.delete(t.id);localStorage.setItem('coupleTrips',JSON.stringify([...selected]));stop();shown=Infinity;progress=0;draw()};label.append(input,document.createTextNode(t.year+'.'+t.month+' '+t.place));list.append(label)});draw()}
year.onchange=()=>{stop();shown=Infinity;renderList()};document.getElementById('all').onclick=()=>{stop();shown=Infinity;draw()};document.getElementById('play').onclick=()=>{if(raf){stop();return}if(!data().length){alert('함께한 여행을 먼저 선택해 주세요.');return}progress=0;draw();animStart=0;animDuration=Math.max(2500,data().length*1000);document.getElementById('play').textContent='⏸ 멈추기';raf=requestAnimationFrame(animate)};renderList();
</script></body></html>
