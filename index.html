  if(!photoSearches[place])return;

   try{
    const q=new URLSearchParams({action:'query',generator:'search',gsrsearch:'filetype:bitmap '+photoSearches[place],gsrnamespace:'6',gsrlimit:'8',prop:'imageinfo',iiprop:'url|mime|extmetadata',iiurlwidth:'480',format:'json',origin:'*'});

    const files=Object.values(result.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.mime?.startsWith('image/')&&p.imageinfo[0].thumburl);
    const best=files.find(p=>/\.(jpg|jpeg|png)$/i.test(p.title))||files[0];

    const info=best.imageinfo[0],meta=info.extmetadata||{};

    const credit=(meta.Artist?.value||'').replace(/<[^>]+>/g,'').slice(0,140);
    photo={url:info.thumburl,source:info.descriptionurl,credit,license};
    photoCache.set(place,photo);
   }catch(e){return}

function distanceKm(a,b){const rad=Math.PI/180,lat1=a[0]*rad,lat2=b[0]*rad,dLat=(b[0]-a[0])*rad,dLon=(b[1]-a[1])*rad;const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}

function travelDuration(place){const dest=destinations[place];if(!dest)return 640;const km=distanceKm(incheon,dest);const southeastAsiaKm=4400;return Math.max(27,533*Math.min(1,km/ecuadorReferenceKm))*(km>southeastAsiaKm?1.2:1)}

let futurePaths='';let from=lastVisited;
for(const target of future){if(from){const bend=Math.sin(target.i*1.91)*63;const d='M '+from.x+' '+from.y+' C '+(from.x+bend)+' '+(from.y+(target.y-from.y)*.42)+' '+(target.x-bend)+' '+(target.y-(target.y-from.y)*.42)+' '+target.x+' '+target.y;futurePaths+='<path d="'+d+'" fill="none" stroke="#9ceaff" stroke-width="5" stroke-dasharray="11 13" stroke-linecap="round" opacity=".85"/>';}from=target;}
let nodes=coords.map(p=>{const ratio=Math.min(1,distanceKm(incheon,destinations[p.t.place]||incheon)/ecuadorReferenceKm);const radius=((27+29*ratio)*1.5*1.35*1.15*0.9).toFixed(1);const pop=(1.20+.55*ratio).toFixed(2);return '<g class="node-stop" tabindex="0" role="button" aria-label="여행 로그 보기" data-stop="'+p.i+'" style="--pop-scale:'+pop+';--destination-color:'+destinationColor(p.t.place)+'"><circle class="node-circle visited" cx="'+p.x+'" cy="'+p.y+'" r="'+radius+'" style="fill:'+destinationColor(p.t.place)+';stroke:'+destinationColor(p.t.place)+'"/>'+destinationArt(p.t.place,p.x,p.y,Number(radius))+imageMarkup(p.t.place,p.x,p.y,Number(radius),p.i,p.t.id)+'<text class="node-date" x="'+p.x+'" y="'+(p.y+94)+'">'+p.t.year+'.'+p.t.month+'</text><text class="node-label" x="'+p.x+'" y="'+(p.y+113)+'">'+esc(p.t.place)+'</text></g>'}).join('');
timeline.querySelectorAll('svg,.empty').forEach(el=>el.remove());timeline.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="지그재그로 이어진 여행 연대기"><path class="route" d="'+path+'"/><path id="travelPath" class="route-inner" d="'+path+'"/><path id="completedPath" class="route-completed" style="display:none" d="'+path+'"/>'+futurePaths+segmentPaths.map((seg,i)=>'<path class="route-colored" data-segment="'+i+'" d="'+seg.d+'" stroke="'+seg.color+'"/>').join('')+'<g class="home-stop" aria-label="출발지 우리 집"><circle cx="330" cy="55" r="48" fill="#0a6389" stroke="#b9f5ff" stroke-width="4"/><text x="330" y="60" text-anchor="middle" dominant-baseline="middle" font-size="39">🏠</text><text x="330" y="119" text-anchor="middle" font-size="18" font-weight="800" fill="#e7fcff">우리 집 · 출발</text></g>'+nodes+'<image id="travelers" class="traveler-photo" href="assets/couple-fullbody.png?v=transparent3" x="-52" y="-45" width="104" height="84"/></svg>');loadDestinationPhotos();prepareProgress(routeCoords);coloredSegments=[...timeline.querySelectorAll('.route-colored')].map(el=>{const length=el.getTotalLength();el.style.strokeDasharray=length+' '+length;el.style.strokeDashoffset=length;return {el,length}});placeTraveler(progress)}
function prepareProgress(coords){const path=document.getElementById('travelPath');if(!path)return;const total=path.getTotalLength();const steps=Math.min(700,Math.max(100,coords.length*12));const samples=[];for(let i=0;i<=steps;i++){const length=total*i/steps;const pt=path.getPointAtLength(length);samples.push({length,x:pt.x,y:pt.y})}stopLengths=coords.map(p=>{let best=0,dist=Infinity;for(const pt of samples){const d=(pt.x-p.x)**2+(pt.y-p.y)**2;if(d<dist){dist=d;best=pt.length}}return best});const completed=document.getElementById('completedPath');completed.style.strokeDasharray=total+' '+total;completed.style.strokeDashoffset=total}
function placeTraveler(t){const path=document.getElementById('travelPath'),trav=document.getElementById('travelers');if(!path||!trav)return;const len=path.getTotalLength();const pt=path.getPointAtLength(len*Math.max(0,Math.min(1,t)));trav.setAttribute('x',pt.x-52);trav.setAttribute('y',pt.y-64);const completed=document.getElementById('completedPath');if(completed){completed.style.strokeDasharray=len+' '+len;completed.style.strokeDashoffset=String(len*(1-Math.max(0,Math.min(1,t))))}const currentLength=len*Math.max(0,Math.min(1,t));coloredSegments.forEach((seg,i)=>{const start=stopLengths[i]??0,end=stopLengths[i+1]??start;const fraction=end>start?Math.max(0,Math.min(1,(currentLength-start)/(end-start))):Number(currentLength>=end);seg.el.style.strokeDashoffset=String(seg.length*(1-fraction))});const stops=[...timeline.querySelectorAll('.node-stop')].filter(n=>!data()[Number(n.dataset.stop)]?.planned);stops.forEach((node,i)=>{const reached=currentLength+1>=stopLengths[i+1];node.classList.toggle('is-complete',reached);node.classList.toggle('is-current',reached&&(i===stops.length-1||currentLength+1<stopLengths[i+2]))})}
function celebrate(index){const nodes=[...timeline.querySelectorAll('.node-stop')].filter(n=>!data()[Number(n.dataset.stop)]?.planned),trav=document.getElementById('travelers');nodes.forEach(n=>n.classList.remove('is-popping'));if(trav)trav.classList.remove('is-celebrating');if(nodes[index]){void nodes[index].getBoundingClientRect();nodes[index].classList.add('is-popping')}if(trav){void trav.getBoundingClientRect();trav.classList.add('is-celebrating')}}
function animate(ts){if(tripPaused){raf=null;return}if(!phaseStart)phaseStart=ts;const n=stopLengths.length;if(!n){stop();return}const path=document.getElementById('travelPath');if(!path){stop();return}const len=path.getTotalLength();if(phase==='arrive'){progress=len?stopLengths[phaseIndex]/len:0;placeTraveler(progress);if(lastStop!==phaseIndex){if(phaseIndex>0)celebrate(phaseIndex-1);lastStop=phaseIndex}status.textContent=phaseIndex===0?'우리 집에서 여행 출발 준비!':'선택한 여행 '+(n-1)+'곳 · '+phaseIndex+'번째 목적지 도착!';if(ts-phaseStart>=533){if(phaseIndex===n-1){phase='idle';raf=null;document.getElementById('play').textContent='▶ 다시 재생';return}phase='move';phaseStart=ts;const trav=document.getElementById('travelers');if(trav)trav.classList.remove('is-celebrating');timeline.querySelectorAll('.is-popping').forEach(el=>el.classList.remove('is-popping'))}}else if(phase==='move'){const start=stopLengths[phaseIndex],end=stopLengths[phaseIndex+1],duration=travelDuration(data()[phaseIndex].place);const fraction=Math.min(1,(ts-phaseStart)/duration);const eased=fraction<.5?2*fraction*fraction:1-Math.pow(-2*fraction+2,2)/2;progress=len?(start+(end-start)*eased)/len:0;placeTraveler(progress);status.textContent='선택한 여행 '+(n-1)+'곳 · 이동 중 '+(phaseIndex+1)+'/'+(n-1)+'곳';if(fraction>=1){phaseIndex++;phase='arrive';phaseStart=ts}}raf=requestAnimationFrame(animate)}
const domesticPlaces=new Set(['제주','울릉도','양양','고성','울진','강릉','영덕','대진']);
// 목적지 클릭/키보드 선택으로 로그북 상세 보기
const overlay=document.getElementById('trip-overlay'),info=document.getElementById('trip-info');
let tripPaused=false,pausedAt=0,resumeAnimation=false;
function openTrip(t,node){
 if(!overlay.hidden)closeTrip();
 resumeAnimation=raf!==null&&phase!=='idle';if(resumeAnimation){tripPaused=true;pausedAt=performance.now();cancelAnimationFrame(raf);raf=null;}
 const rect=node.querySelector('.node-circle').getBoundingClientRect(),container=timeline.getBoundingClientRect();
 const centerX=rect.left-container.left+rect.width/2,centerY=rect.top-container.top+rect.height/2;
 const popupWidth=Math.min(210,container.width*.58),margin=8;
 const left=centerX+rect.width/2+margin+popupWidth<=container.width?centerX+rect.width/2+margin:Math.max(0,centerX-rect.width/2-popupWidth-margin);
 overlay.style.left=Math.max(0,left)+'px';overlay.style.top=Math.max(0,centerY-rect.height/2-12)+'px';
 const count=v=>v==null?'미기재':v+'회';
 info.innerHTML='<div style="color:#9fe9fa;font-size:12px;letter-spacing:2px">OUR DIVE LOGBOOK</div><h2 id="trip-title">'+esc(t.place)+(t.planned?' · 예정':'')+'</h2><p>📅 '+t.year+'.'+t.month+(t.detail?' · '+esc(t.detail):'')+'</p><p>🤿 '+esc(t.shop||'다이빙샵 미기재')+'</p><div class="log-grid"><div class="log-count"><small>지희 로그</small><b>'+count(t.jihee)+'</b></div><div class="log-count"><small>종상 로그</small><b>'+count(t.jongsang)+'</b></div></div><div class="note">'+(t.planned?'예정 로그입니다. 실제 다이빙 후 기록을 갱신해 주세요.':'로그북에 기록된 해당 여행의 다이빙 횟수입니다.')+'</div>';
 overlay.hidden=false;document.getElementById('trip-close').focus();
}
function closeTrip(){overlay.hidden=true;if(tripPaused){tripPaused=false;if(resumeAnimation&&phase!=='idle'){phaseStart+=performance.now()-pausedAt;raf=requestAnimationFrame(animate)}}resumeAnimation=false}
document.getElementById('trip-close').onclick=closeTrip;
overlay.addEventListener('click',e=>{if(e.target===overlay)closeTrip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeTrip()});
timeline.addEventListener('click',e=>{const node=e.target.closest('.node-stop');if(!node)return;const t=data()[Number(node.dataset.stop)];if(t)openTrip(t,node)});
timeline.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const node=e.target.closest('.node-stop');if(!node)return;e.preventDefault();const t=data()[Number(node.dataset.stop)];if(t)openTrip(t,node)});

year.onchange=()=>{stop();shown=Infinity;progress=0;draw()};regionFilter.onchange=()=>{stop();shown=Infinity;progress=0;draw()};people.onchange=()=>{stop();shown=Infinity;progress=0;draw()};document.getElementById('play').onclick=()=>{if(raf){stop();return}if(!data().some(t=>!t.planned)){alert('아직 출발할 수 있는 여행이 없습니다.');return}progress=0;draw();lastStop=-1;phaseIndex=0;phase='arrive';phaseStart=0;document.getElementById('play').textContent='⏸ 멈추기';raf=requestAnimationFrame(animate)};fetchCloudPhotos().then(()=>{if(phase==='idle'){shown=Infinity;draw()}}).catch(e=>console.warn('Cloud photo list unavailable',e));try{draw()}catch(err){console.error('Timeline initialization error:',err);status.textContent='여행 경로 표시 중 오류: '+err.message;timeline.insertAdjacentHTML('beforeend','<p class="empty">연대기를 불러오지 못했어요. 페이지를 새로고침해 주세요.</p>')}
