<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 둘의 여행 지도</title>

<style>body{margin:0;background:#101e2c;color:#f6f6f6;font-family:system-ui,sans-serif}header{padding:20px;background:#172a3d}h1{margin:0 0 8px;font-size:25px}.sub{color:#b6c9d5}#map{height:57vh;min-height:350px}main{padding:18px;max-width:950px;margin:auto}button,select{padding:11px;border-radius:10px;border:0;background:#fff;color:#142638;margin:4px}button{cursor:pointer}.panel{background:#20364a;border-radius:15px;padding:14px;margin-top:12px}.trip{display:flex;gap:12px;align-items:center;padding:9px;border-bottom:1px solid #405365}.trip label{flex:1}.trip small{color:#b6c9d5}input[type=checkbox]{width:20px;height:20px}.leaflet-container{background:#a7d4e2}footer{color:#b6c9d5;padding:15px;font-size:12px}.hero{text-align:center;padding:30px 15px;background:linear-gradient(145deg,#bdebf2,#fdf1cf);color:#18384b}.hero h2{font-size:27px}.couple{display:flex;justify-content:center;gap:25px}.diver{font-size:64px;position:relative}.diver span{font-size:35px}.diver small{display:block;font-size:11px;max-width:145px}.journey{padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;max-width:1100px;margin:auto}.stop{background:#fffaf0;color:#23384a;border-radius:16px;padding:13px;text-align:center;box-shadow:0 5px 18px #0003;position:relative;animation:appear .4s ease both}.stop:not(:last-child):after{content:'➜';position:absolute;right:-19px;top:46%;color:#ff9d60;z-index:2}.tag{background:#ff806b;color:white;border-radius:8px;padding:5px;font-size:12px;font-weight:700}.art{font-size:65px;background:linear-gradient(#a7e5f6,#e8f8f6);border-radius:12px;margin:10px 0;padding:15px}.stop h3{margin:6px}.stop p{color:#61758a}.empty{grid-column:1/-1;text-align:center;color:#d5e6ef}@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(max-width:500px){.journey{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.stop:not(:last-child):after{display:none}} </style></head>
<body><header><h1>✈️ 우리 둘의 여행 지도</h1><div class="sub">2018–2026 · 함께한 여행을 선택하고 경로를 재생해요</div></header>
<section class="hero"><div class="couple"><div class="diver">🤿<span>📷</span><small>검정 마스크 · A7C + Nauticam 돔포트</small></div><div class="diver">🤿<span>📹</span><small>흰색 마스크 · GoPro</small></div></div><h2>우리의 바닷속 여행 연대기</h2><p>둘이 함께한 여행을 한 장의 여정표로 ✨</p></section><section id="journey" class="journey"></section><main><div class="panel"><button id="play">▶ 여행 재생</button><button id="reset">↺ 처음부터</button><label>연도 <select id="year"><option value="all">전체</option></select></label><div id="status" class="sub"></div></div>
<div class="panel"><h3>💕 함께 다녀온 여행 체크</h3><p class="sub">원본 다이빙 로그에는 부부 동행 여부가 없어 기본값은 모두 미선택이에요. 체크 내용은 이 브라우저에만 저장됩니다.</p><div id="trips"></div></div></main><footer>여행지 좌표는 지역 중심의 근삿값입니다. 개인 사진과 개인정보는 저장소에 포함하지 않았습니다.</footer>

<script>
const places={보홀:[9.65,123.85],제주:[33.48,126.53],사이판:[15.19,145.75],모알보알:[9.94,123.40],아날라오:[13.76,120.93],고성:[38.38,128.47],팔라우:[7.5,134.62],울진:[36.99,129.4],강릉:[37.75,128.9],영덕:[36.41,129.37],양양:[38.08,128.62],대전:[36.35,127.38],울릉도:[37.49,130.9],릴로안:[9.45,123.3],라파즈:[24.14,-110.31],베르데:[13.55,120.93],오키나와:[26.21,127.68],시파단:[4.11,118.63],홍해:[27.26,33.81],코모도:[-8.55,119.49],반다해:[-4.5,129.9],키커락:[-0.78,-89.51],갈라파고스:[-0.95,-90.97],푸껫:[7.88,98.39],시밀란:[8.65,97.65],이시가키:[24.34,124.16]};
const raw=[
[2018,'06','보홀'],[2018,'09','제주'],[2018,'09','사이판'],[2018,'12','보홀'],
[2019,'03','모알보알'],[2019,'06','사이판'],[2019,'07','아날라오'],[2019,'09','고성'],[2019,'10','아날라오'],[2019,'12','팔라우'],
[2020,'04','제주'],[2020,'06','제주'],[2020,'06','울진'],[2020,'07','울진'],[2020,'09','제주'],[2020,'10','제주'],[2020,'10','강릉'],[2020,'11','영덕'],
[2021,'08','제주'],[2021,'08','양양'],[2021,'08','고성'],[2021,'09','제주'],[2021,'10','제주'],[2021,'10','제주'],[2021,'10','대전'],[2021,'10','울릉도'],[2021,'11','제주'],
[2022,'05','릴로안'],[2022,'09','라파즈'],[2022,'10','울릉도'],[2022,'11','베르데'],
[2023,'01','보홀'],[2023,'03','오키나와'],[2023,'05','시파단'],[2023,'06','릴로안'],[2023,'06','사이판'],[2023,'07','홍해'],[2023,'08','코모도'],
[2024,'04','아날라오'],[2024,'06','라파즈'],[2024,'09','반다해'],[2024,'09','시파단'],
[2025,'04','라파즈'],[2025,'04','제주'],[2025,'05','팔라우'],[2025,'08','양양'],[2025,'09','제주'],[2025,'10','키커락'],[2025,'10','갈라파고스'],
[2026,'03','푸껫'],[2026,'03','시밀란'],[2026,'06','오키나와'],[2026,'10','제주'],[2026,'11','이시가키']
];
const trips=raw.map((r,i)=>({id:i,year:r[0],month:r[1],place:r[2],coord:places[r[2]]}));
let selected=new Set(JSON.parse(localStorage.getItem('coupleTrips')||'[]')),timer=null,shown=Infinity;
const year=document.getElementById('year'),list=document.getElementById('trips'),status=document.getElementById('status'),journey=document.getElementById('journey');
[...new Set(trips.map(t=>t.year))].forEach(y=>{let o=document.createElement('option');o.value=y;o.textContent=y+'년';year.append(o)});
function filtered(){return trips.filter(t=>selected.has(t.id)&&(year.value==='all'||t.year===+year.value))}
function draw(count){journey.innerHTML='';const arr=filtered();arr.slice(0,count).forEach((t,i)=>{const card=document.createElement('article');card.className='stop';const tag=document.createElement('div');tag.className='tag';tag.textContent='TRIP '+String(i+1).padStart(2,'0');const art=document.createElement('div');art.className='art';art.textContent=['🐠','🐢','🪸','🦈','🌊','🐬'][i%6];const name=document.createElement('h3');name.textContent=t.place;const date=document.createElement('p');date.textContent=t.year+'년 '+t.month+'월';card.append(tag,art,name,date);journey.append(card)});status.textContent='함께한 여행 '+arr.length+'개 · 표시 '+Math.min(count,arr.length)+'개';if(!arr.length){journey.innerHTML='<p class="empty">아래에서 함께 다녀온 여행을 체크하면 여정표가 나타나요 💕</p>'}}
function stop(){if(timer)clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ 여정 재생'}
function render(){list.innerHTML='';trips.filter(t=>year.value==='all'||t.year===+year.value).forEach(t=>{let row=document.createElement('div');row.className='trip';let check=document.createElement('input');check.type='checkbox';check.checked=selected.has(t.id);check.addEventListener('change',()=>{check.checked?selected.add(t.id):selected.delete(t.id);localStorage.setItem('coupleTrips',JSON.stringify([...selected]));stop();draw(Infinity)});let label=document.createElement('label');label.textContent=t.place;let date=document.createElement('small');date.textContent=t.year+'.'+t.month;row.append(check,label,date);list.append(row)});draw(Infinity)}
year.onchange=()=>{stop();render()};document.getElementById('reset').onclick=()=>{stop();draw(0)};
document.getElementById('play').onclick=()=>{if(timer){stop();return}const arr=filtered();if(!arr.length){alert('함께한 여행을 먼저 체크해 주세요.');return}let n=0;draw(0);document.getElementById('play').textContent='⏸ 멈추기';timer=setInterval(()=>{n++;draw(n);if(n>=arr.length)stop()},650)};
render();
</script></body></html>
