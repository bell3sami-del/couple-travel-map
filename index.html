function distanceKm(a,b){const rad=Math.PI/180,lat1=a[0]*rad,lat2=b[0]*rad,dLat=(b[0]-a[0])*rad,dLon=(b[1]-a[1])*rad;const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}

const lanes=[180,315,475,390,215,430,280,170,350,480,260,415,195,320,460];
const coords=visible.map((t,i)=>({x:lanes[i%lanes.length]+Math.sin(i*2.37)*15,y:top+i*stepY,t,i}));
let path='',segmentPaths=[];coords.forEach((p,i)=>{if(i===0){path='M '+p.x+' '+p.y;return}const prev=coords[i-1];let command;{const bend=Math.sin(i*1.91)*63;command=' C '+(prev.x+bend)+' '+(prev.y+stepY*.42)+' '+(p.x-bend)+' '+(p.y-stepY*.42)+' '+p.x+' '+p.y}path+=command;segmentPaths.push({d:'M '+prev.x+' '+prev.y+command,color:destinationColor(p.t.place)})});
let nodes=coords.map(p=>{const ratio=Math.min(1,distanceKm(incheon,destinations[p.t.place]||incheon)/ecuadorReferenceKm);const radius=((27+29*ratio)*1.5).toFixed(1);const pop=(1.20+.55*ratio).toFixed(2);return '<g class="node-stop" data-stop="'+p.i+'" style="--pop-scale:'+pop+';--destination-color:'+destinationColor(p.t.place)+'"><circle class="node-circle visited" cx="'+p.x+'" cy="'+p.y+'" r="'+radius+'" style="fill:'+destinationColor(p.t.place)+';stroke:'+destinationColor(p.t.place)+'"/>'+destinationArt(p.t.place,p.x,p.y,Number(radius))+'<text class="node-date" x="'+p.x+'" y="'+(p.y+94)+'">'+p.t.year+'.'+p.t.month+'</text><text class="node-label" x="'+p.x+'" y="'+(p.y+113)+'">'+esc(p.t.place)+'</text></g>'}).join('');
timeline.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="지그재그로 이어진 여행 연대기"><path class="route" d="'+path+'"/><path id="travelPath" class="route-inner" d="'+path+'"/><path id="completedPath" class="route-completed" style="display:none" d="'+path+'"/>'+segmentPaths.map((seg,i)=>'<path class="route-colored" data-segment="'+i+'" d="'+seg.d+'" stroke="'+seg.color+'"/>').join('')+nodes+'<image id="travelers" class="traveler-photo" href="assets/couple-fullbody.png?v=transparent3" x="-52" y="-45" width="104" height="84"/></svg>';prepareProgress(coords);coloredSegments=[...timeline.querySelectorAll('.route-colored')].map(el=>{const length=el.getTotalLength();el.style.strokeDasharray=length+' '+length;el.style.strokeDashoffset=length;return {el,length}});placeTraveler(progress)}
function prepareProgress(coords){const path=document.getElementById('travelPath');if(!path)return;const total=path.getTotalLength();const steps=Math.min(700,Math.max(100,coords.length*12));const samples=[];for(let i=0;i<=steps;i++){const length=total*i/steps;const pt=path.getPointAtLength(length);samples.push({length,x:pt.x,y:pt.y})}stopLengths=coords.map(p=>{let best=0,dist=Infinity;for(const pt of samples){const d=(pt.x-p.x)**2+(pt.y-p.y)**2;if(d<dist){dist=d;best=pt.length}}return best});const completed=document.getElementById('completedPath');completed.style.strokeDasharray=total+' '+total;completed.style.strokeDashoffset=total}
function placeTraveler(t){const path=document.getElementById('travelPath'),trav=document.getElementById('travelers');if(!path||!trav)return;const len=path.getTotalLength();const pt=path.getPointAtLength(len*Math.max(0,Math.min(1,t)));trav.setAttribute('x',pt.x-52);trav.setAttribute('y',pt.y-64);const completed=document.getElementById('completedPath');if(completed){completed.style.strokeDasharray=len+' '+len;completed.style.strokeDashoffset=String(len*(1-Math.max(0,Math.min(1,t))))}const currentLength=len*Math.max(0,Math.min(1,t));coloredSegments.forEach((seg,i)=>{const start=stopLengths[i]??0,end=stopLengths[i+1]??start;const fraction=end>start?Math.max(0,Math.min(1,(currentLength-start)/(end-start))):Number(currentLength>=end);seg.el.style.strokeDashoffset=String(seg.length*(1-fraction))});const stops=timeline.querySelectorAll('.node-stop');stops.forEach((node,i)=>{const reached=currentLength+1>=stopLengths[i];node.classList.toggle('is-complete',reached);node.classList.toggle('is-current',reached&&(i===stops.length-1||currentLength+1<stopLengths[i+1]))})}
function celebrate(index){const nodes=timeline.querySelectorAll('.node-stop'),trav=document.getElementById('travelers');nodes.forEach(n=>n.classList.remove('is-popping'));if(trav)trav.classList.remove('is-celebrating');if(nodes[index]){void nodes[index].getBoundingClientRect();nodes[index].classList.add('is-popping')}if(trav){void trav.getBoundingClientRect();trav.classList.add('is-celebrating')}}
function animate(ts){if(!phaseStart)phaseStart=ts;const n=stopLengths.length;if(!n){stop();return}const path=document.getElementById('travelPath');if(!path){stop();return}const len=path.getTotalLength();if(phase==='arrive'){progress=len?stopLengths[phaseIndex]/len:0;placeTraveler(progress);if(lastStop!==phaseIndex){celebrate(phaseIndex);lastStop=phaseIndex}status.textContent='선택한 여행 '+n+'곳 · '+(phaseIndex+1)+'번째 목적지 도착!';if(ts-phaseStart>=640){if(phaseIndex===n-1){phase='idle';raf=null;document.getElementById('play').textContent='▶ 다시 재생';return}phase='move';phaseStart=ts;const trav=document.getElementById('travelers');if(trav)trav.classList.remove('is-celebrating');timeline.querySelectorAll('.is-popping').forEach(el=>el.classList.remove('is-popping'))}}else if(phase==='move'){const start=stopLengths[phaseIndex],end=stopLengths[phaseIndex+1],duration=travelDuration(data()[phaseIndex+1].place);const fraction=Math.min(1,(ts-phaseStart)/duration);const eased=fraction<.5?2*fraction*fraction:1-Math.pow(-2*fraction+2,2)/2;progress=len?(start+(end-start)*eased)/len:0;placeTraveler(progress);status.textContent='선택한 여행 '+n+'곳 · 이동 중 '+(phaseIndex+1)+'/'+n+'곳';if(fraction>=1){phaseIndex++;phase='arrive';phaseStart=ts}}raf=requestAnimationFrame(animate)}
const domesticPlaces=new Set(['제주','울릉도','양양','고성','울진','강릉','영덕']);
function renderList(){list.innerHTML='';const filtered=trips.filter(t=>year.value==='all'||t.year===Number(year.value));for(const region of [{title:'🇰🇷 국내 여행',domestic:true},{title:'🌏 해외 여행',domestic:false}]){const items=filtered.filter(t=>domesticPlaces.has(t.place)===region.domestic);const section=document.createElement('section');section.className='trip-region';const heading=document.createElement('h4');const title=document.createElement('span');title.textContent=region.title;const count=document.createElement('small');count.textContent=items.length+'회 · 선택 '+items.filter(t=>selected.has(t.id)).length+'회';heading.append(title,count);section.append(heading);const grid=document.createElement('div');grid.className='trip-region-items';items.forEach(t=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=selected.has(t.id);input.onchange=()=>{input.checked?selected.add(t.id):selected.delete(t.id);localStorage.setItem('coupleTrips',JSON.stringify([...selected]));stop();shown=Infinity;progress=0;renderList()};label.append(input,document.createTextNode(t.year+'.'+t.month+' '+t.place));grid.append(label)});section.append(grid);list.append(section)}draw()}
year.onchange=()=>{stop();shown=Infinity;renderList()};regionFilter.onchange=()=>{stop();shown=Infinity;progress=0;draw()};document.getElementById('all').onclick=()=>{stop();shown=Infinity;draw()};document.getElementById('play').onclick=()=>{if(raf){stop();return}if(!data().length){alert('함께한 여행을 먼저 선택해 주세요.');return}progress=0;draw();lastStop=-1;phaseIndex=0;phase='arrive';phaseStart=0;document.getElementById('play').textContent='⏸ 멈추기';raf=requestAnimationFrame(animate)};renderList();
</script></body></html>
