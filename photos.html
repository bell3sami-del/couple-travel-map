<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여행 사진 관리 · 우리 둘의 바다 여행</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#063455,#057493);font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#f0fbff;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:22px 16px 80px}h1{font-size:clamp(23px,6vw,32px);margin:16px 0 8px}p{line-height:1.6;color:#bce6f3}.back{color:#c5faff;text-decoration:none;font-weight:700}.notice{padding:13px 15px;background:#ffffff16;border:1px solid #8eeaff55;border-radius:15px;font-size:13px;line-height:1.6}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tools input,.tools select{background:#064364;border:1px solid #75c6de;border-radius:12px;padding:12px;color:white;min-width:0;flex:1 1 130px}.tools input::placeholder{color:#b0d6e4}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}.card{background:#073d60;border:1px solid #5aafc966;border-radius:18px;padding:13px;min-width:0}.photo{height:138px;border-radius:14px;background:#0a6680;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px;font-size:35px}.photo img{width:100%;height:100%;object-fit:cover}.meta{font-size:12px;color:#a7e3f2;margin:5px 0}.name{font-size:18px;font-weight:800}.actions{display:flex;gap:7px;margin-top:12px}.upload{flex:1;cursor:pointer;background:#22b9d0;color:#032c40;border:0;border-radius:10px;padding:10px 7px;text-align:center;font-weight:800;font-size:13px}.upload input{display:none}.remove{background:#ffffff17;border:1px solid #ffffff44;color:white;border-radius:10px;padding:9px;cursor:pointer}.remove:disabled{opacity:.3}.status{margin:12px 0;color:#e8fba9;font-size:13px}.count{font-weight:700;color:#9ee7f8}.badge{font-size:11px;color:#8ef8ba}.empty{text-align:center;padding:30px}</style></head><body><main class="wrap"><a class="back" href="index.html">← 연대기로 돌아가기</a><h1>📷 여행 사진 관리</h1><p>여행마다 대표 사진 한 장을 등록해 줘. 등록한 사진은 연대기의 원형 목적지에 표시돼.</p><div class="notice">🔒 사진은 서버로 전송되지 않고 <b>현재 브라우저에만 저장</b>돼. 다른 기기나 시크릿 모드에서는 보이지 않으며 브라우저 데이터를 삭제하면 사라질 수 있어. 중요한 원본 사진은 따로 보관해 줘.</div><div class="notice" style="margin-top:12px"><div id="auth-label">사진 등록·수정은 승인된 관리자만 가능해.</div><form id="login-form" style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px"><input type="email" id="email" placeholder="관리자 이메일" required style="flex:1 1 130px;min-width:0"><input type="password" id="password" placeholder="비밀번호" required style="flex:1 1 130px;min-width:0"><button class="upload" type="submit">로그인</button></form><button id="logout" class="remove" hidden>로그아웃</button></div><div class="tools"><input id="search" placeholder="여행지·다이빙샵 검색"><select id="year"><option value="all">전체 연도</option></select><select id="filter"><option value="all">전체 여행</option><option value="missing">미등록만</option><option value="saved">등록 완료만</option></select></div><div id="count" class="count"></div><div id="status" class="status" role="status"></div><section id="grid" class="grid"></section></main><script>
const raw=[[2018,"06","보홀","디퍼",12,12],[2018,"09","제주","오션트리",5,5],[2018,"09","사이판","프로다이버스",null,12],[2018,"12","보홀","저스트다이브",6,6],[2019,"03","모알보알","클럽하리",10,10],[2019,"06","사이판","프로다이버스",21,21],[2019,"07","아날라오","샤크리조트",null,6,"날짜 미기재 · 임시 7월 표시"],[2019,"09","고성","문암리조트",3,3],[2019,"10","아날라오","클럽제이",13,13],[2019,"12","팔라우","다리다이버스",9,9],[2020,"04","제주","오션트리",8,8,"4/30~5/3"],[2020,"06","제주","오션트리",10,5,"6/3~6/8"],[2020,"06","울진","H2O",2,2,"6/27"],[2020,"07","울진","문희수잠수교실",2,2,"7/8"],[2020,"09","제주","오션트리",10,10,"9/30~10/3"],[2020,"10","제주","다이브랜드",16,10,"10/15~19"],[2020,"10","강릉","해원리조트",2,2,"10/24 · 스텔라"],[2020,"11","영덕","대진다이브",3,3,"11/7 · 대진"],[2021,"08","제주","꿈꾸는고래 외 3곳",11,13,"8/9~16"],[2021,"08","양양","38마린",2,2,"8/28"],[2021,"08","고성","문암리조트",2,2,"8/29"],[2021,"09","제주","오션트리",11,11,"9/17"],[2021,"10","제주","오션트리",6,6,"10/2"],[2021,"10","제주","오션트리",9,3,"10/8"],[2021,"10","대진","대진다이브",5,5,"10/23"],[2021,"10","울릉도","아쿠아캠프",6,6,"10/29"],[2021,"11","제주","오션트리",8,5,"11/12"],[2022,"05","릴로안","건우리조트",13,13,"5/4~9"],[2022,"09","라파즈","발렌티나",11,11,"9/3~12"],[2022,"10","울릉도","현포다이브",5,5,"10/1~3"],[2022,"11","베르데","레졸루트",11,11,"11/3~7"],[2023,"01","보홀","라팡리조트",9,9,"1/20~25"],[2023,"03","오키나와","39ers",null,null,"3/1~5 · 로그 미기재"],[2023,"05","시파단","카팔라이 리조트",18,18,"5/2~8"],[2023,"06","릴로안","건우리조트",null,10,"6/1~7"],[2023,"06","사이판","프로다이버스",8,8,"6/14~18"],[2023,"07","홍해","M/Y 블루멜로디",18,18,"7/14~24"],[2023,"08","코모도","씨사파리 챙호",19,19,"8/12~20"],[2024,"04","아날라오","클럽제이",6,6,"4/12~15"],[2024,"06","말라파스쿠아","솔다이버",10,10,"6/5~9"],[2024,"09","반다해","화이트만타",19,19,"9/15~21"],[2024,"09","누사페니다","히포다이브",3,3,"9/23"],[2025,"04","말라파스쿠아","솔다이버",9,9,"4/4~8"],[2025,"04","제주","수중산책",2,2,"4/18~20 · 한림 모자반"],[2025,"05","팔라우","데이드림",19,19,"5/3~11"],[2025,"08","양양","38마린",3,3,"8/30"],[2025,"09","제주","다이브랜드",8,4,"9/5~6 · 갈치투어"],[2025,"10","갈라파고스","아쿠아어드벤쳐 / 갈라파고스 마스터",19,19,"10/5 키커락 2회 + 10/6~12 리브어보드 17회"],[2026,"03","푸껫","블루 다이브센터",3,3,"3/15"],[2026,"03","시밀란","사우스시암 SSD4",14,15,"3/17~20"],[2026,"06","오키나와","홍스타다이브",12,null,"6/3~8"],[2026,"10","제주","다이브랜드",7,null,"10/9~11"],[2026,"11","이시가키","마린메이트",8,8,"11/12~15 · 예정"]];
const SB_URL='https://edgymzlsldphgxpitsgm.supabase.co',SB_KEY='sb_publishable_9RiqtjAqKmY1LdXgHqAP8Q_sArk3oOr';
let session=null;
async function api(path,opts={}){const h={'apikey':SB_KEY,'Content-Type':'application/json',...(session?{'Authorization':'Bearer '+session.access_token}:{}),...(opts.headers||{})};const res=await fetch(SB_URL+path,{...opts,headers:h});if(!res.ok){let message=await res.text();throw Error(res.status+' '+message.slice(0,200))}if(res.status===204)return null;return res.json()}
async function login(email,password){session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});localStorage.setItem('travelPhotoSession',JSON.stringify(session));await refresh()}
async function refresh(){const old=JSON.parse(localStorage.getItem('travelPhotoSession')||'null');if(!old)return;try{session=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:old.refresh_token})});localStorage.setItem('travelPhotoSession',JSON.stringify(session))}catch(e){session=null;localStorage.removeItem('travelPhotoSession')}}
async function loadRemote(){const rows=await api('/rest/v1/travel_photos?select=trip_id,object_path');photos.clear();for(const r of rows)photos.set(r.trip_id,SB_URL+'/storage/v1/object/public/travel-photos/'+r.object_path+'?v='+Date.now());render()}
async function saveRemote(id,data){if(!session)throw Error('관리자 로그인이 필요해');const bin=await(await fetch(data)).blob();const path='trips/'+id+'-'+Date.now()+'.jpg';const res=await fetch(SB_URL+'/storage/v1/object/travel-photos/'+path,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'image/jpeg'},body:bin});if(!res.ok)throw Error('사진 업로드 권한 또는 네트워크 확인: '+res.status);const previous=await api('/rest/v1/travel_photos?trip_id=eq.'+id+'&select=object_path');await api('/rest/v1/travel_photos?on_conflict=trip_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({trip_id:id,object_path:path})});if(previous[0])await fetch(SB_URL+'/storage/v1/object/travel-photos/'+previous[0].object_path,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token}});await loadRemote()}
async function deleteRemote(id){if(!session)throw Error('관리자 로그인이 필요해');const rows=await api('/rest/v1/travel_photos?trip_id=eq.'+id+'&select=object_path');await api('/rest/v1/travel_photos?trip_id=eq.'+id,{method:'DELETE'});if(rows[0])await fetch(SB_URL+'/storage/v1/object/travel-photos/'+rows[0].object_path,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access_token}});await loadRemote()}
const photos=new Map();const grid=document.getElementById('grid'),status=document.getElementById('status'),count=document.getElementById('count'),year=document.getElementById('year'),filter=document.getElementById('filter'),search=document.getElementById('search');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const y of [...new Set(raw.map(r=>r[0]))])year.insertAdjacentHTML('beforeend','<option>'+y+'</option>');
function render(){const q=search.value.trim().toLowerCase();const matches=raw.map((r,id)=>({r,id})).filter(({r,id})=>(year.value==='all'||String(r[0])===year.value)&&(!q||(r[2]+' '+r[3]).toLowerCase().includes(q))&&(filter.value==='all'||(filter.value==='saved')===photos.has(id)));count.textContent='전체 '+raw.length+'개 여행 · 등록 '+photos.size+'장 · 현재 '+matches.length+'건';grid.innerHTML=matches.map(({r,id})=>'<article class="card"><div class="photo">'+(photos.has(id)?'<img alt="등록한 '+esc(r[2])+' 사진" src="'+photos.get(id)+'">':'🌊')+'</div><div class="meta">'+r[0]+'.'+r[1]+' · #'+(id+1)+'</div><div class="name">'+esc(r[2])+' '+(photos.has(id)?'<span class="badge">● 등록 완료</span>':'')+'</div><div class="meta">'+esc(r[3]||'다이빙샵 미기재')+'</div><div class="actions"><label class="upload">'+(photos.has(id)?'사진 변경':'사진 등록')+'<input type="file" accept="image/*" data-id="'+id+'"></label><button class="remove" data-remove="'+id+'" '+(!photos.has(id)?'disabled':'')+'>삭제</button></div></article>').join('')||'<p class="empty">해당하는 여행이 없어.</p>'}
async function resize(file){const src=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=()=>rej(reader.error);reader.readAsDataURL(file)});const img=await new Promise((res,rej)=>{const image=new Image();image.onload=()=>res(image);image.onerror=()=>rej(new Error('이미지를 읽을 수 없어'));image.src=src});const size=600,canvas=document.createElement('canvas');canvas.width=canvas.height=size;const ctx=canvas.getContext('2d');const scale=Math.max(size/img.width,size/img.height);ctx.drawImage(img,(size-img.width*scale)/2,(size-img.height*scale)/2,img.width*scale,img.height*scale);return canvas.toDataURL('image/jpeg',.82)}
grid.addEventListener('change',async e=>{if(!e.target.matches('input[type=file]'))return;const id=Number(e.target.dataset.id),file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){status.textContent='이미지 파일을 선택해 줘';return}status.textContent='사진을 처리하는 중...';try{const data=await resize(file);await saveRemote(id,data);status.textContent=raw[id][0]+'.'+raw[id][1]+' '+raw[id][2]+' 사진 저장 완료!';render()}catch(err){status.textContent='저장 실패: '+err.message}});
grid.addEventListener('click',async e=>{const btn=e.target.closest('[data-remove]');if(!btn)return;const id=Number(btn.dataset.remove);if(!confirm('이 여행의 등록 사진을 삭제할까?'))return;try{await deleteRemote(id);status.textContent='사진 삭제 완료';render()}catch(err){status.textContent='삭제 실패: '+err.message}});
[year,filter,search].forEach(el=>el.addEventListener(el===search?'input':'change',render));
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();status.textContent='로그인 중...';try{await login(document.getElementById('email').value,document.getElementById('password').value);updateAuth();status.textContent='로그인 완료'}catch(err){status.textContent='로그인 실패: '+err.message}});
document.getElementById('logout').onclick=()=>{session=null;localStorage.removeItem('travelPhotoSession');updateAuth()};
function updateAuth(){document.getElementById('login-form').hidden=!!session;document.getElementById('logout').hidden=!session;document.getElementById('auth-label').textContent=session?'관리자 로그인 상태 · 업로드 권한은 서버에서 확인해.':'사진 등록·수정은 승인된 관리자만 가능해.';render()}
(async()=>{try{await refresh();updateAuth();await loadRemote()}catch(err){status.textContent='클라우드 사진 조회 실패: '+err.message;render()}})();
</script></body></html>
