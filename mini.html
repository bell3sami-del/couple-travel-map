<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종상 지희 · 미니 바다 여행</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#1d2730;background:#f8f9f8}button,select{font:inherit}main{width:min(980px,100%);margin:auto;padding:15px 15px 20px;min-height:100dvh;display:flex;flex-direction:column;gap:12px;background:radial-gradient(ellipse at 10% 20%,#e8eeee88,transparent 45%),#fff}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:clamp(17px,3vw,26px);margin:0;letter-spacing:-.5px}.eyebrow{font-size:10px;letter-spacing:3px;color:#56616b;font-weight:750;margin-bottom:4px}a{color:#1d2730;text-decoration:none;border:1.5px solid #27333b;border-radius:22px;padding:8px 11px;background:#fff;font-size:12px;font-weight:750;white-space:nowrap}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:7px}.controls select,.controls button{min-width:0;background:#fff;border:1.5px solid #25323a;color:#1e2932;border-radius:13px;padding:10px 8px;font-weight:700;font-size:clamp(11px,2vw,14px)}#play{background:#e8f4f8;cursor:pointer}#reset{cursor:pointer}.info{font-size:12px;color:#4d5962;display:flex;justify-content:space-between;align-items:center;gap:10px}.track{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(49px,1fr);align-content:stretch;gap:5px 7px;position:relative}.stop{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;padding:2px;cursor:pointer;opacity:.29;filter:grayscale(.9);transition:opacity .5s,filter .5s,transform .5s}.stop.visited{opacity:1;filter:none}.stop.current{transform:scale(1.08);z-index:2}.circle{width:clamp(27px,4.8vh,55px);height:clamp(27px,4.8vh,55px);border-radius:50%;border:2px solid #25323b;display:grid;place-items:center;overflow:hidden;background:#e9ebeb;box-shadow:0 2px 0 #17242b12}.visited .circle{border-color:#27343d;box-shadow:0 0 0 3px #a8e9e7,0 2px 7px #23333b1a}.circle img{width:100%;height:100%;object-fit:cover}.circle svg{width:55%;height:55%;stroke:#4c5960;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.name{font-size:clamp(9px,1.6vw,12px);font-weight:800;text-align:center;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.date{font-size:clamp(8px,1.3vw,10px);color:#68727b;line-height:1}.diver{position:absolute;right:-5px;top:-8px;font-size:18px;filter:none;animation:bob .75s ease-in-out infinite alternate;z-index:3}@keyframes bob{to{transform:translateY(-4px)}}.empty{grid-column:1/-1;text-align:center;align-self:center;color:#66737c}.footer{text-align:center;font-size:10px;color:#7b858c}dialog{border:2px solid #26333c;border-radius:18px;background:#ededed;color:#17212a;padding:20px;width:min(340px,calc(100% - 32px));box-shadow:4px 5px 0 #1d283325}dialog::backdrop{background:#18232d70}dialog h2{margin:8px 0}dialog p{font-size:13px;line-height:1.6}dialog button{float:right;border:1px solid #26333c;background:white;border-radius:50%;width:29px;height:29px;cursor:pointer}#counts{font-weight:750}
@media(max-width:580px){main{height:100dvh;overflow:hidden;padding:10px 9px;gap:8px}.controls{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.controls select{padding:9px 3px;font-size:11px}.controls button{grid-column:1/-1;padding:9px}.track{gap:1px 2px;overflow:hidden}.circle{width:clamp(22px,4.1vh,42px);height:clamp(22px,4.1vh,42px)}.name{font-size:9px}.date{font-size:8px}.diver{font-size:15px}.footer{display:none}}
@media(max-height:690px){.circle{width:clamp(20px,3.5vh,38px);height:clamp(20px,3.5vh,38px)}.track{grid-auto-rows:minmax(38px,1fr)}}
@media(prefers-reduced-motion:reduce){.stop,.diver{animation:none;transition:none}}
</style></head><body><main><header><div><div class="eyebrow">OUR OCEAN JOURNEY · MINI</div><h1>종상 지희 · 바다 여행 한눈에</h1></div><a href="index.html">↗ 원래 연대기</a></header><div class="controls"><select id="year" aria-label="연도"><option value="all">전체 연도</option></select><select id="region" aria-label="국내 해외"><option value="all">국내 + 해외</option><option value="domestic">🇰🇷 국내만</option><option value="international" selected>🌏 해외만</option></select><select id="people" aria-label="동행자"><option value="both">💞 둘 다</option><option value="jongsang">🤿 종상</option><option value="jihee">🤿 지희</option></select><button id="play">▶ 여행 시작</button></div><div class="info"><span id="counts">여행 불러오는 중…</span><span id="progress">0 / 0</span></div><section class="track" id="track" aria-label="여행지 미니 타임라인"></section><div class="footer">사진은 컬러 그대로 · 지나온 여행지만 선명하게</div></main><dialog id="detail"><button id="close" aria-label="닫기">✕</button><div id="detailContent"></div></dialog><script>
const raw=[[2018,"06","보홀","디퍼",12,12],[2018,"09","제주","오션트리",5,5],[2018,"09","사이판","프로다이버스",null,12],[2018,"12","보홀","저스트다이브",6,6],[2019,"03","모알보알","클럽하리",10,10],[2019,"06","사이판","프로다이버스",21,21],[2019,"07","아날라오","샤크리조트",null,6,"날짜 미기재 · 임시 7월 표시"],[2019,"09","고성","문암리조트",3,3],[2019,"10","아날라오","클럽제이",13,13],[2019,"12","팔라우","다리다이버스",9,9],[2020,"04","제주","오션트리",8,8,"4/30~5/3"],[2020,"06","제주","오션트리",10,5,"6/3~6/8"],[2020,"06","울진","H2O",2,2,"6/27"],[2020,"07","울진","문희수잠수교실",2,2,"7/8"],[2020,"09","제주","오션트리",10,10,"9/30~10/3"],[2020,"10","제주","다이브랜드",16,10,"10/15~19"],[2020,"10","강릉","해원리조트",2,2,"10/24 · 스텔라"],[2020,"11","영덕","대진다이브",3,3,"11/7 · 대진"],[2021,"08","제주","꿈꾸는고래 외 3곳",11,13,"8/9~16"],[2021,"08","양양","38마린",2,2,"8/28"],[2021,"08","고성","문암리조트",2,2,"8/29"],[2021,"09","제주","오션트리",11,11,"9/17"],[2021,"10","제주","오션트리",6,6,"10/2"],[2021,"10","제주","오션트리",9,3,"10/8"],[2021,"10","대진","대진다이브",5,5,"10/23"],[2021,"10","울릉도","아쿠아캠프",6,6,"10/29"],[2021,"11","제주","오션트리",8,5,"11/12"],[2022,"05","릴로안","건우리조트",13,13,"5/4~9"],[2022,"09","라파즈","발렌티나",11,11,"9/3~12"],[2022,"10","울릉도","현포다이브",5,5,"10/1~3"],[2022,"11","베르데","레졸루트",11,11,"11/3~7"],[2023,"01","보홀","라팡리조트",9,9,"1/20~25"],[2023,"03","오키나와","39ers",null,null,"3/1~5 · 로그 미기재"],[2023,"05","시파단","카팔라이 리조트",18,18,"5/2~8"],[2023,"06","릴로안","건우리조트",null,10,"6/1~7"],[2023,"06","사이판","프로다이버스",8,8,"6/14~18"],[2023,"07","홍해","M/Y 블루멜로디",18,18,"7/14~24"],[2023,"08","코모도","씨사파리 챙호",19,19,"8/12~20"],[2024,"04","아날라오","클럽제이",6,6,"4/12~15"],[2024,"06","말라파스쿠아","솔다이버",10,10,"6/5~9"],[2024,"09","반다해","화이트만타",19,19,"9/15~21"],[2024,"09","누사페니다","히포다이브",3,3,"9/23"],[2025,"04","말라파스쿠아","솔다이버",9,9,"4/4~8"],[2025,"04","제주","수중산책",2,2,"4/18~20 · 한림 모자반"],[2025,"05","팔라우","데이드림",19,19,"5/3~11"],[2025,"08","양양","38마린",3,3,"8/30"],[2025,"09","제주","다이브랜드",8,4,"9/5~6 · 갈치투어"],[2025,"10","갈라파고스","아쿠아어드벤쳐 / 갈라파고스 마스터",19,19,"10/5 키커락 2회 + 10/6~12 리브어보드 17회"],[2026,"03","푸껫","블루 다이브센터",3,3,"3/15"],[2026,"03","시밀란","사우스시암 SSD4",14,15,"3/17~20"],[2026,"06","오키나와","홍스타다이브",12,null,"6/3~8"],[2026,"10","제주","다이브랜드",7,null,"10/9~11"],[2026,"11","이시가키","마린메이트",8,8,"11/12~15 · 예정"]];
const trips=raw.map((r,id)=>({id,year:r[0],month:r[1],place:r[2],shop:r[3],jihee:r[4],jongsang:r[5],detail:r[6]||'',planned:r[0]===2026&&r[1]==='11'}));
const domesticPlaces=new Set(['제주','고성','울진','강릉','영덕','양양','대진','울릉도']);
const CLOUD_URL='https://edgymzlsldphgxpitsgm.supabase.co',CLOUD_KEY='sb_publishable_9RiqtjAqKmY1LdXgHqAP8Q_sArk3oOr';
const year=document.getElementById('year'),region=document.getElementById('region'),people=document.getElementById('people'),track=document.getElementById('track'),play=document.getElementById('play'),progressLabel=document.getElementById('progress'),counts=document.getElementById('counts'),dialog=document.getElementById('detail');
let photos=new Map(),visible=[],visited=0,timer=null,playing=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const placeholder='<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="9" r="3"/><path d="M3 25l9-10 6 6 5-5 6 9"/></svg>';
for(const y of [...new Set(trips.map(t=>t.year))].sort((a,b)=>b-a))year.insertAdjacentHTML('beforeend','<option value="'+y+'">'+y+'년</option>');
function filterTrips(){return trips.filter(t=>t.place!=='푸껫'&&(year.value==='all'||t.year===Number(year.value))&&(region.value==='all'||(region.value==='domestic')===domesticPlaces.has(t.place))&&(people.value==='both'?(t.jihee>0||t.jongsang>0):people.value==='jihee'?t.jihee>0:t.jongsang>0));}
function halt(){if(timer)clearTimeout(timer);timer=null;playing=false;play.textContent='▶ 여행 시작'}
function draw(){visible=filterTrips();visited=0;counts.textContent='선택한 여행 '+visible.length+'곳';track.innerHTML=visible.map((t,i)=>'<button type="button" class="stop" data-index="'+i+'" aria-label="'+esc(t.year+'.'+t.month+' '+t.place)+'"><span class="circle">'+(photos.has(t.id)?'<img src="'+esc(photos.get(t.id))+'" alt="">':placeholder)+'</span><span class="date">'+t.year+'.'+t.month+'</span><span class="name">'+esc(t.place)+'</span></button>').join('')||'<p class="empty">조건에 맞는 여행이 없어.</p>';updateProgress()}
function updateProgress(){const nodes=[...track.querySelectorAll('.stop')];nodes.forEach((el,i)=>{el.classList.toggle('visited',i<visited);el.classList.toggle('current',i===visited-1&&playing);el.querySelector('.diver')?.remove();if(i===visited-1&&playing)el.insertAdjacentHTML('beforeend','<span class="diver" aria-hidden="true">🤿</span>')});progressLabel.textContent=visited+' / '+visible.length}
function step(){if(!playing)return;if(visited>=visible.length){halt();updateProgress();play.textContent='↻ 다시 여행';return}visited++;updateProgress();timer=setTimeout(step,620)}
play.addEventListener('click',()=>{if(playing){halt();updateProgress();return}if(!visible.length)return;if(visited>=visible.length)visited=0;playing=true;play.textContent='Ⅱ 일시정지';step()});
[year,region,people].forEach(el=>el.addEventListener('change',()=>{halt();draw()}));
track.addEventListener('click',e=>{const node=e.target.closest('[data-index]');if(!node)return;const t=visible[Number(node.dataset.index)];if(!t)return;document.getElementById('detailContent').innerHTML='<div class="eyebrow">OUR DIVE LOGBOOK</div><h2>'+esc(t.place)+'</h2><p>📅 '+t.year+'.'+t.month+(t.detail?' · '+esc(t.detail):'')+'</p><p>🤿 '+esc(t.shop)+'</p><p><b>지희</b> '+(t.jihee??0)+'회　 <b>종상</b> '+(t.jongsang??0)+'회</p>';dialog.showModal()});
document.getElementById('close').onclick=()=>dialog.close();
async function loadPhotos(){try{const response=await fetch(CLOUD_URL+'/rest/v1/travel_photos?select=trip_id,object_path',{headers:{apikey:CLOUD_KEY}});if(!response.ok)throw Error('사진 조회 실패');const rows=await response.json();photos=new Map(rows.map(r=>[r.trip_id,CLOUD_URL+'/storage/v1/object/public/travel-photos/'+r.object_path]));draw()}catch(error){console.warn(error)}}
draw();loadPhotos();
</script></body></html>
